name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_call:

env:
  # Neuester Patch-Stand der Go-Version aus go.mod (wichtig für govulncheck)
  GO_VERSION: "1.26.x"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Formatierung prüfen (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Nicht gofmt-formatiert:"; echo "$unformatted"; exit 1
          fi

      - name: go mod tidy prüfen
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Abdeckung
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Bekannte Schwachstellen (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker-Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
